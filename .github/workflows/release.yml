name: Release Windows App

# Secure publishing pipeline for the MediCore-LIS Windows desktop app.
##
# Triggered by pushing a version tag that matches the root package.json version:
#   npm version patch            # e.g. 1.0.0 -> 1.0.1
#   git push && git push origin v1.0.1
#
# Publishing uses GitHub Actions' built-in GITHUB_TOKEN. No token or secret is
# ever committed to the repository. The job only runs for tag refs, so ordinary
# branch pushes and manual dispatches on a branch never create a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # only useful to re-run an existing tag-triggered run

permissions:
  contents: write # required to create the GitHub Release and upload assets

jobs:
  release:
    # Only ever build/publish for an actual version tag. This prevents
    # duplicate or accidental releases from branch pushes / manual dispatch.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v$(node -p "require('./package.json').version")"
          echo "Pushed tag: ${TAG} | Expected from package.json: ${EXPECTED}"
          if [ "${TAG}" != "${EXPECTED}" ]; then
            echo "::error::Tag '${TAG}' does not match package.json version (expected '${EXPECTED}'). Update the version with 'npm version <patch|minor|major>' and push the matching tag."
            exit 1
          fi

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build

      - name: Build and publish Windows installer to GitHub Releases
        env:
          # electron-builder reads GH_TOKEN to publish to GitHub Releases.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

